name: PHP compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v6
      - name: Lint with PHP ${{ matrix.php }}
        run: >-
          docker run --rm
          -v "$PWD:/work"
          -w /work
          php:${{ matrix.php }}-cli
          sh -c "find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l >/dev/null"
