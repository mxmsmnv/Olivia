name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*VERSION_STRING[[:space:]]*=[[:space:]]*'\\([^']*\\)'.*/\\1/p" Olivia.module.php | head -n 1)
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          grep -Fq "## [$version]" CHANGELOG.md

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          stage=$(mktemp -d)
          git archive --format=tar --prefix=Olivia/ HEAD | tar -xf - -C "$stage"
          (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/Olivia-$version.zip" Olivia)
          sha256sum "Olivia-$version.zip" > "Olivia-$version.zip.sha256"
          unzip -tq "Olivia-$version.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "Olivia-${GITHUB_REF_NAME#v}.zip"
          "Olivia-${GITHUB_REF_NAME#v}.zip.sha256"
          --verify-tag
          --title "Olivia ${GITHUB_REF_NAME#v}"
          --generate-notes
