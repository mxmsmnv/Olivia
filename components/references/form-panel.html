<!-- form-panel - compact conversion form for booking, quote, search or newsletter. -->
<section class="max-w-4xl mx-auto px-6 py-16">
	<div class="rounded-2xl border border-zinc-100 bg-zinc-50 p-7 sm:p-10">
		<h2 class="text-2xl font-bold text-zinc-900">Start with a few details</h2><p class="mt-2 text-zinc-500">Explain what happens after submission.</p>
		<form class="mt-7 grid sm:grid-cols-2 gap-4"><label class="text-sm font-medium text-zinc-700">Name<input class="mt-2 w-full rounded-lg border border-zinc-200 bg-white px-4 py-3" type="text"></label><label class="text-sm font-medium text-zinc-700">Email<input class="mt-2 w-full rounded-lg border border-zinc-200 bg-white px-4 py-3" type="email"></label><button class="sm:col-span-2 rounded-lg bg-brand px-6 py-3 font-semibold text-white" type="submit">Continue</button></form>
	</div>
</section>
